]

[[group]]
name = "positive variable assumption"
type = "expression"
key = "sqrt(t^2)"
opts = { vars = ["t positive"] }
cases = [
  ["t", "correct"],
  ["-t", "incorrect"],
  ["|t|", "correct"],
]

[[group]]
name = "integer variable"
type = "expression"
key = "(-1)^n"
opts = { vars = ["n integer"] }
cases = [
  ["cos(pi*n)", "correct"],
  ["(-1)^(n+2)", "correct"],
  ["(-1)^(n+1)", "incorrect"],
  ["1", "incorrect"],
]

[[group]]
name = "degrees mode expressions"
type = "expression"
key = "sin(x)"
opts = { angles = "degrees" }
cases = [
  ["cos(90 - x)", "correct"],
  ["sin(x)", "correct"],
  ["cos(x - 90)", "correct"],
  ["sin(x + 360)", "correct"],
  ["sin(x + 2pi)", "incorrect"],
  ["sin(180 - x)", "correct"],
]

[[group]]
name = "key undefined everywhere on its domain"
type = "expression"
key = "sqrt(x)"
opts = { domain = "x < 0" }
cases = [
  ["sqrt(x)", "correct"],
  ["sqrt(x) + 1", "undecidable"],
]

[[group]]
name = "syntax errors never count"
type = "expression"
key = "x^2 + 1"
cases = [
  ["x^^2", "invalid"],
  ["x^2 +* 1", "invalid"],
  ["2x)", "invalid"],
  ["((x)", "invalid"],
  ["x^2+1)", "invalid"],
  ["x|", "invalid"],
  ["x,,", "invalid"],
  ["@x", "invalid"],
  ["x^2 + 1 =", "invalid"],
  ["$x$", "invalid"],
  ["x^2 + 1 % 2", "invalid"],
  ["x^(2", "invalid"],
  ["sin()", "invalid"],
  ["sqrt()", "invalid"],
  ["x^2 1", "invalid"],
  ["x^2+1;x", "invalid"],
  ["none", "invalid"],
  ["DNE", "invalid"],
  ["x < 1", "invalid"],
  ["<x, 1>", "invalid"],
  ["[[x]]", "invalid"],
  ["{x}", "invalid"],
  ["inf", "invalid"],
  ["x^2 + inf", "invalid"],
  ["x^2 + 1 + ---x", "invalid"],
  ["f(x)", "invalid"],
  ["x^2 + 1!", "invalid"],
  ["x'", "invalid"],
  ["x^2 + 01", "invalid"],
  ["3 1/2", "invalid"],
]

[[group]]
name = "two-piece domain"
type = "expression"
key = "sqrt(x^2 - 4)"
cases = [
  ["sqrt(x-2)*sqrt(x+2)", "incorrect"],
  ["sqrt((x-2)(x+2))", "correct"],
  ["|x|*sqrt(1 - 4/x^2)", "correct"],
  ["x*sqrt(1 - 4/x^2)", "incorrect"],
]

[[group]]
name = "two-piece log domain"
type = "expression"
key = "ln(x^2 - 1)"
cases = [
  ["ln(x-1) + ln(x+1)", "incorrect"],
  ["ln|x-1| + ln|x+1|", "correct"],
  ["ln|x^2 - 1|", "correct"],
]

[[group]]
name = "answer defined more widely than the key"
type = "expression"
key = "sqrt(x-2)*sqrt(x+2)"
cases = [
  ["sqrt(x^2-4)", "correct"],
  ["sqrt(x^2+4)", "incorrect"],
]

[[group]]
name = "many pieces"
type = "expression"
key = "sqrt(sin(x))"
cases = [
  ["sin(x)^(1/2)", "correct"],
  ["sqrt(|sin(x)|)", "correct"],
  ["sqrt(sin(|x|))", "incorrect"],
]
