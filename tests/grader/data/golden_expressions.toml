# Golden cases (MATH-11): expressions and the known traps.

[[group]]
name = "difference of squares"
type = "expression"
key = "x^2 - 4"
cases = [
  ["(x-2)(x+2)", "correct"],
  ["(x+2)(x-2)", "correct"],
  ["x^2-4", "correct"],
  ["x*x - 4", "correct"],
  ["x^2 - 2^2", "correct"],
  ["-4 + x^2", "correct"],
  ["x^2 + 4", "incorrect"],
  ["x^2 - 2", "incorrect"],
  ["(x-2)^2", "incorrect"],
  ["x^2 - 4x", "incorrect"],
  ["(x-2)(x+3)", "incorrect"],
  ["x^2 - 4.0", "correct"],
  ["x^2 - 4.001", "incorrect"],
  ["x**2 - 4", "correct"],
  ["x² - 4", "correct"],
  ["y^2 - 4", "invalid"],
  ["X^2 - 4", "invalid"],
  ["x2 - 4", "invalid"],
  ["x^ - 4", "incorrect"],
  ["x^2 - 4 = 0", "invalid"],
  ["x^2, -4", "invalid"],
  ["(x - 2)(x + 2", "invalid"],
]

[[group]]
name = "perfect square"
type = "expression"
key = "(x+1)^2"
cases = [
  ["x^2+2x+1", "correct"],
  ["(1+x)^2", "correct"],
  ["(x+1)(x+1)", "correct"],
  ["x^2+1", "incorrect"],
  ["x^2+2x+2", "incorrect"],
  ["(x-1)^2", "incorrect"],
  ["(x+1)^3", "incorrect"],
  ["x^2 + 2*x + 1", "correct"],
  ["(-x-1)^2", "correct"],
  ["x(x+2)+1", "correct"],
]

[[group]]
name = "quadratic"
type = "expression"
key = "3x^2 - 2x + 5"
cases = [
  ["5 - 2x + 3x^2", "correct"],
  ["3x^2+2x+5", "incorrect"],
  ["3x^2-2x+4", "incorrect"],
  ["2x^2-2x+5", "incorrect"],
  ["3x^2-2x", "incorrect"],
  ["x(3x-2)+5", "correct"],
  ["3*x^2 - 2*x + 5", "correct"],
  ["4x^2 - 2x + 5", "incorrect"],
  ["3x^2 - 3x + 5", "incorrect"],
  ["3x^2 - x + 5", "incorrect"],
  ["-3x^2 + 2x - 5", "incorrect"],
]

[[group]]
name = "chain rule derivative"
type = "expression"
key = "6x(x^2 + 1)^2"
cases = [
  ["6x(x^2+1)^2", "correct"],
  ["6x^5+12x^3+6x", "correct"],
  ["6x*(x^2+1)*(x^2+1)", "correct"],
  ["6x(x^2+1)", "incorrect"],
  ["3x(x^2+1)^2", "incorrect"],
  ["6x(x^2+1)^3", "incorrect"],
  ["6(x^2+1)^2", "incorrect"],
  ["3(x^2+1)^2*2x", "correct"],
  ["2x*3(x^2+1)^2", "correct"],
  ["3(x^2+1)^2", "incorrect"],
]

[[group]]
name = "removable discontinuity in the answer"
type = "expression"
key = "x + 1"
cases = [
  ["(x^2-1)/(x-1)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["(x^2+2x+1)/(x+1)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["(x^2-1)/(x+1)", "incorrect"],
  ["x + 1 + 0*x", "correct"],
  ["(x^3+1)/(x^2-x+1)", "correct"],
]

[[group]]
name = "removable discontinuity in the key"
type = "expression"
key = "(x^2-1)/(x-1)"
cases = [
  ["x+1", "correct"],
  ["x-1", "incorrect"],
  ["(x+1)(x-1)/(x-1)", "correct"],
]

[[group]]
name = "rational function"
type = "expression"
key = "1/(x-1)"
cases = [
  ["1/(x-1)", "correct"],
  ["-1/(1-x)", "correct"],
  ["1/x - 1", "incorrect"],
  ["(x+1)/(x^2-1)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["1/(x+1)", "incorrect"],
  ["(x-1)^-1", "correct"],
  ["1/x-1", "incorrect"],
]

[[group]]
name = "split fraction"
type = "expression"
key = "(2x+3)/(x^2+1)"
cases = [
  ["2x/(x^2+1) + 3/(x^2+1)", "correct"],
  ["(3+2x)/(1+x^2)", "correct"],
  ["(2x+3)/(x^2-1)", "incorrect"],
  ["2x+3/(x^2+1)", "incorrect"],
]

[[group]]
name = "two variables"
type = "expression"
key = "x^2*y + x*y^2"
opts = { vars = ["x", "y"] }
cases = [
  ["xy(x+y)", "invalid"],
  ["x*y*(x+y)", "correct"],
  ["x*y(x+y)", "correct"],
  ["x^2*y + x*y^2", "correct"],
  ["x*y*(x-y)", "incorrect"],
  ["x^2*y", "incorrect"],
  ["y*x*(y+x)", "correct"],
  ["x y (x+y)", "invalid"],
]

[[group]]
name = "linear in two variables"
type = "expression"
key = "2x + 3y"
cases = [
  ["3y+2x", "correct"],
  ["2(x+y)+y", "correct"],
  ["3x+2y", "incorrect"],
  ["2x+3z", "invalid"],
]

[[group]]
name = "exponential"
type = "expression"
key = "e^x"
cases = [
  ["e^x", "correct"],
  ["exp(x)", "correct"],
  ["e^(x)", "correct"],
  ["2.718^x", "incorrect"],
  ["2.71828^x", "incorrect"],
  ["e*x", "incorrect"],
  ["ex", "invalid"],
  ["x^e", "incorrect"],
  ["e^-x", "incorrect"],
  ["1/e^(-x)", "correct"],
  ["(e^(x/2))^2", "correct"],
  ["sqrt(e^(2x))", "correct"],
  ["e^x*e^0", "correct"],
  ["e^(x+1)/e", "correct"],
]

[[group]]
name = "e to the 2x"
type = "expression"
key = "e^(2x)"
cases = [
  ["e^(2x)", "correct"],
  ["(e^x)^2", "correct"],
  ["e^x*e^x", "correct"],
  ["e^2x", "incorrect"],
  ["e^(2*x)", "correct"],
  ["exp(2x)", "correct"],
  ["e^2^x", "incorrect"],
  ["2e^x", "incorrect"],
  ["e^(x)^2", "incorrect"],
  ["e^(x+x)", "correct"],
]

[[group]]
name = "e squared times x"
type = "expression"
key = "e^2*x"
cases = [
  ["e^2x", "correct"],
  ["x*e^2", "correct"],
  ["e^(2x)", "incorrect"],
  ["e^2*x", "correct"],
]

[[group]]
name = "x e to the x"
type = "expression"
key = "x*e^x"
cases = [
  ["xe^x", "invalid"],
  ["x*e^x", "correct"],
  ["x e^x", "invalid"],
  ["e^x*x", "correct"],
  ["x(e^x)", "correct"],
  ["(e^x)x", "correct"],
]

[[group]]
name = "gaussian"
type = "expression"
key = "e^(-x^2)"
cases = [
  ["e^(-x^2)", "correct"],
  ["1/e^(x^2)", "correct"],
  ["e^-x^2", "correct"],
  ["e^(-x)^2", "incorrect"],
  ["exp(-x^2)", "correct"],
  ["e^(x^2)", "incorrect"],
]

[[group]]
name = "ln of x squared"
type = "expression"
key = "ln(x^2)"
cases = [
  ["2ln|x|", "correct"],
  ["2ln(abs(x))", "correct"],
  ["2*ln(|x|)", "correct"],
  ["ln(x^2)", "correct"],
  ["2ln(x)", "incorrect"],
  ["ln(x)^2", "incorrect"],
  ["(ln(x))^2", "incorrect"],
  ["ln(2x)", "incorrect"],
  ["ln|x|^2", "invalid"],
  ["2 ln|x|", "correct"],
  ["ln(|x|^2)", "correct"],
  ["ln(x*x)", "correct"],
  ["ln|x| + ln|x|", "correct"],
  ["ln(x) + ln(x)", "incorrect"],
]

[[group]]
name = "ln of x squared for positive x"
type = "expression"
key = "ln(x^2)"
opts = { domain = "x > 0" }
cases = [
  ["2ln(x)", "correct"],
  ["2ln|x|", "correct"],
  ["ln(x)+ln(x)", "correct"],
  ["ln(2x)", "incorrect"],
  ["ln(x)^2", "incorrect"],
]

[[group]]
name = "two ln x has its own domain"
type = "expression"
key = "2ln(x)"
cases = [
  ["ln(x^2)", "correct"],
  ["2ln|x|", "correct"],
  ["ln(2x)", "incorrect"],
]

[[group]]
name = "log base two"
type = "expression"
key = "ln(x)/ln(2)"
cases = [
  ["log_2(x)", "correct"],
  ["ln(x)/ln(2)", "correct"],
  ["log(x)/log(2)", "correct"],
  ["ln(x)/2", "incorrect"],
  ["log_2(2x) - 1", "correct"],
  ["log_2x", "invalid"],
  ["log2(x)", "invalid"],
]

[[group]]
name = "common log"
type = "expression"
key = "log(x)"
cases = [
  ["ln(x)/ln(10)", "correct"],
  ["log_10(x)", "correct"],
  ["ln(x)", "incorrect"],
  ["log_1(x)", "invalid"],
]

[[group]]
name = "natural log"
type = "expression"
key = "ln(x)"
cases = [
  ["log_e(x)", "correct"],
  ["-ln(1/x)", "correct"],
  ["ln(x^2)/2", "correct"],
  ["ln|x|", "correct"],
  ["log(x)", "incorrect"],
  ["ln(x)+1", "incorrect"],
  ["lnx", "invalid"],
  ["ln x", "invalid"],
  ["ln(x", "invalid"],
]

[[group]]
name = "log rules on a domain"
type = "expression"
key = "ln(x+1) - ln(x)"
opts = { domain = "x > 0" }
cases = [
  ["ln((x+1)/x)", "correct"],
  ["ln(1+1/x)", "correct"],
  ["ln(x+1)/ln(x)", "incorrect"],
  ["ln(1)", "incorrect"],
]

[[group]]
name = "square root of x squared against x"
type = "expression"
key = "x"
cases = [
  ["sqrt(x^2)", "incorrect"],
  ["abs(x)", "incorrect"],
  ["sqrt(x)^2", "incorrect"],
  ["(x^3)^(1/3)", "correct"],
  ["root(x^3, 3)", "correct"],
  ["x^(3/3)", "correct"],
  ["x", "correct"],
  ["-(-x)", "correct"],
  ["x^1", "correct"],
  ["e^(ln(x))", "incorrect"],
  ["ln(e^x)", "correct"],
]

[[group]]
name = "absolute value"
type = "expression"
key = "abs(x)"
cases = [
  ["sqrt(x^2)", "correct"],
  ["|x|", "correct"],
  ["|-x|", "correct"],
  ["x", "incorrect"],
  ["(x^2)^(1/2)", "correct"],
  ["root(x^4, 4)", "correct"],
  ["x*sign(x)", "correct"],
  ["-x", "incorrect"],
  ["|x", "invalid"],
]

[[group]]
name = "square root of x squared for nonnegative x"
type = "expression"
key = "x"
opts = { domain = "x >= 0" }
cases = [
  ["sqrt(x^2)", "correct"],
  ["|x|", "correct"],
  ["sqrt(x)^2", "correct"],
  ["e^(ln(x))", "incorrect"],  # review: false accept (hole: undefined where the key is defined) at 0 (domain x >= 0)
]

[[group]]
name = "square root"
type = "expression"
key = "sqrt(x)"
cases = [
  ["x^(1/2)", "correct"],
  ["sqrt(|x|)", "correct"],
  ["root(x, 2)", "correct"],
  ["x^0.5", "correct"],
  ["x/sqrt(x)", "incorrect"],  # review: false accept (hole: undefined where the key is defined) at 0
  ["sqrt(x)/x", "incorrect"],
  ["sqrtx", "invalid"],
  ["sqrt x", "invalid"],
]

[[group]]
name = "two root x"
type = "expression"
key = "2sqrt(x)"
cases = [
  ["sqrt(4x)", "correct"],
  ["sqrt(2x)", "incorrect"],
  ["2x^(1/2)", "correct"],
  ["2*sqrt(x)", "correct"],
]

[[group]]
name = "cube root of x"
type = "expression"
key = "root(x, 3)"
cases = [
  ["x^(1/3)", "correct"],
  ["root(x,3)", "correct"],
  ["-root(-x,3)", "correct"],
  ["sign(x)*abs(x)^(1/3)", "correct"],
  ["abs(x)^(1/3)", "incorrect"],
  ["sqrt(x)", "incorrect"],
  ["root(x)", "invalid"],
  ["root(x, 3.5)", "incorrect"],
]

[[group]]
name = "two thirds power"
type = "expression"
key = "x^(2/3)"
cases = [
  ["(x^2)^(1/3)", "correct"],
  ["root(x,3)^2", "correct"],
  ["root(x^2, 3)", "correct"],
  ["abs(x)^(2/3)", "correct"],
  ["x^(1/3)", "incorrect"],
  ["(x^(1/3))^2", "correct"],
]

[[group]]
name = "pythagorean identity"
type = "expression"
key = "1"
opts = { vars = ["x"] }
cases = [
  ["sin(x)^2 + cos(x)^2", "correct"],
  ["sec(x)^2 - tan(x)^2", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["cos(x)^2 - sin(x)^2", "incorrect"],
  ["csc(x)^2 - cot(x)^2", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["1", "correct"],
  ["x/x", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["(x-3)/(x-3)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["|x|/x", "incorrect"],
  ["sin(x)^2 + cos(x)^2 + 10^(-25)", "incorrect"],
]

[[group]]
name = "double angle sine"
type = "expression"
key = "sin(2x)"
cases = [
  ["2sin(x)cos(x)", "correct"],
  ["2*sin(x)*cos(x)", "correct"],
  ["sin(x)cos(x)", "incorrect"],
  ["2sin(x)", "incorrect"],
  ["cos(2x)", "incorrect"],
  ["sin(x+x)", "correct"],
  ["sin2x", "invalid"],
  ["sin 2x", "invalid"],
  ["2cos(x)sin(x)", "correct"],
]

[[group]]
name = "double angle cosine"
type = "expression"
key = "cos(2x)"
cases = [
  ["cos(x)^2 - sin(x)^2", "correct"],
  ["1 - 2sin(x)^2", "correct"],
  ["2cos(x)^2 - 1", "correct"],
  ["1 - sin(x)^2", "incorrect"],
  ["cos(x)^2", "incorrect"],
  ["2cos(x) - 1", "incorrect"],
  ["cos^2(x) - sin^2(x)", "invalid"],
]

[[group]]
name = "tangent"
type = "expression"
key = "tan(x)"
cases = [
  ["sin(x)/cos(x)", "correct"],
  ["1/cot(x)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["sec(x)*sin(x)", "correct"],
  ["cos(x)/sin(x)", "incorrect"],
  ["sin(x)*cos(x)", "incorrect"],
  ["tan(x + pi)", "correct"],
]

[[group]]
name = "secant squared"
type = "expression"
key = "sec(x)^2"
cases = [
  ["1 + tan(x)^2", "correct"],
  ["1/cos(x)^2", "correct"],
  ["tan(x)^2", "incorrect"],
  ["sec(x^2)", "incorrect"],
]

[[group]]
name = "sine squared"
type = "expression"
key = "sin(x)^2"
cases = [
  ["(1 - cos(2x))/2", "correct"],
  ["1 - cos(x)^2", "correct"],
  ["sin(x^2)", "incorrect"],
  ["sin(x)*sin(x)", "correct"],
  ["sin^2(x)", "invalid"],
  ["sin(x)²", "correct"],
]

[[group]]
name = "derivative of cosine"
type = "expression"
key = "-sin(x)"
cases = [
  ["sin(-x)", "correct"],
  ["cos(x + pi/2)", "correct"],
  ["sin(x)", "incorrect"],
  ["-cos(x)", "incorrect"],
  ["-1*sin(x)", "correct"],
]

[[group]]
name = "cosine shifts"
type = "expression"
key = "cos(x)"
cases = [
  ["sin(pi/2 - x)", "correct"],
  ["sin(x + pi/2)", "correct"],
  ["cos(-x)", "correct"],
  ["cos(x + 2pi)", "correct"],
  ["cos(x + pi)", "incorrect"],
  ["sin(x)", "incorrect"],
  ["cos(x + 6.2832)", "incorrect"],
]

[[group]]
name = "arctangent"
