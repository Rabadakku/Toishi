# Golden cases (MATH-11): numbers. Each group is one card; each case is
# [answer, expected] or [answer, expected, "mathlive"].
# expected: correct | incorrect | invalid (no attempt) | undecidable | unsupported

[[group]]
name = "fraction"
type = "number"
key = "-2/3"
cases = [
  ["-2/3", "correct"],
  ["-4/6", "correct"],
  ["-0.6667", "correct"],
  ["-0.667", "correct"],
  ["-0.6666", "correct"],
  ["-0.67", "correct"],  # M7: within the 1% default (ADR-0019 item 11); was incorrect at 0.1%
  ["-0.66", "correct"],  # M7: exactly 1% off; the 1% default is inclusive (ADR-0019 item 11)
  ["2/3", "incorrect"],
  ["-3/2", "incorrect"],
  ["-(2/3)", "correct"],
  ["(-2)/3", "correct"],
  ["2/-3", "correct"],
  ["-2÷3", "correct"],
  ["−2/3", "correct"],
  ["-1 + 1/3", "correct"],
  ["-2/3 + 0", "correct"],
  ["DNE", "incorrect"],
  ["inf", "incorrect"],
  ["x", "invalid"],
  ["-2/3, 1", "invalid"],
  ["x = -2/3", "invalid"],
  ["", "invalid"],
  ["-2//3", "invalid"],
  ["- 2 / 3", "correct"],
]

[[group]]
name = "root two over two"
type = "number"
