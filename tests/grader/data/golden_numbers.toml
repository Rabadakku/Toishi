cases = [
  ["22/7", "incorrect"],
  ["355/113", "incorrect"],
  ["3.1416", "correct"],
  ["3.14", "correct"],
  ["3.1", "incorrect"],
  ["4arctan(1)", "correct"],
  ["arccos(-1)", "correct"],
