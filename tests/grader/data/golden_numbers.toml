  ["sqrt(2)/2", "correct"],
  ["2^(-1/2)", "correct"],
  ["sqrt(1/2)", "correct"],
  ["0.7071", "correct"],
  ["0.707", "correct"],
  ["0.71", "correct"],  # M7: within the 1% default (ADR-0019 item 11); was incorrect at 0.1%
  ["0.7", "incorrect"],
  ["sqrt(2)", "incorrect"],
  ["2/sqrt(2)", "incorrect"],
  ["sin(pi/4)", "correct"],
  ["cos(pi/4)", "correct"],
  ["root(2, 2)/2", "correct"],
  ["sqrt2/2", "invalid"],
  ["√(2)/2", "correct"],
  ["(1/2)^(1/2)", "correct"],
  ["2^(1/2)/2", "correct"],
  ["sqrt(2)/2 + 10^(-30)", "incorrect"],
]

[[group]]
