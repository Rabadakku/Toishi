type = "matrix"
key = "[[1, 2], [3, 4]]"
cases = [
  ["\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}", "correct", "mathlive"],
  ["\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}", "correct", "mathlive"],
  ["\\begin{pmatrix}1&3\\\\2&4\\end{pmatrix}", "incorrect", "mathlive"],
  ["\\begin{pmatrix}1&2\\\\3\\end{pmatrix}", "invalid", "mathlive"],
  ["\\begin{pmatrix}1&2\\\\3&4", "invalid", "mathlive"],
]

[[group]]
name = "ml-vector"
type = "vector"
key = "<1, -2, 3>"
cases = [
  ["\\langle1,-2,3\\rangle", "correct", "mathlive"],
  ["\\left\\langle1,-2,3\\right\\rangle", "correct", "mathlive"],
  ["\\langle1,2,3\\rangle", "incorrect", "mathlive"],
]

[[group]]
name = "ml-equation"
type = "equation"
key = "y = 2x + 1"
cases = [
  ["y=2x+1", "correct", "mathlive"],
  ["2x-y+1=0", "correct", "mathlive"],
  ["y=2x-1", "incorrect", "mathlive"],
  ["y=\\frac{4x+2}{2}", "correct", "mathlive"],
]

[[group]]
name = "ml-antiderivative"
type = "antiderivative"
key = "x^3/3 + C"
cases = [
  ["\\frac{x^3}{3}+C", "correct", "mathlive"],
  ["\\frac{1}{3}x^{3}+C", "correct", "mathlive"],
  ["\\frac{x^3}{3}", "correct", "mathlive"],
  ["x^3+C", "incorrect", "mathlive"],
  ["\\frac{x^{3}}{3}+x+C", "incorrect", "mathlive"],
]

[[group]]
name = "ml-rejects"
type = "expression"
key = "x^2"
cases = [
  ["\\int x\\,dx", "invalid", "mathlive"],
  ["\\pm x^2", "invalid", "mathlive"],
  ["\\frac{d}{dx}x^3", "invalid", "mathlive"],
  ["\\placeholder{}", "invalid", "mathlive"],
  ["\\frac{}{}", "invalid", "mathlive"],
  ["\\left(x", "invalid", "mathlive"],
  ["x^{", "invalid", "mathlive"],
  ["{{{{x}}}}^2", "correct", "mathlive"],
  ["\\sqrt[", "invalid", "mathlive"],
  ["\\\\", "invalid", "mathlive"],
  ["\\input{/etc/passwd}", "invalid", "mathlive"],
  ["\\def\\x{1}", "invalid", "mathlive"],
  ["\\href{http://x}{x}", "invalid", "mathlive"],
  ["", "invalid", "mathlive"],
  ["\\sqrt[0]{x}", "incorrect", "mathlive"],
  ["\\sqrt[x]{2}", "incorrect", "mathlive"],
  ["\\sqrt[-1]{x}", "incorrect", "mathlive"],
  ["\\sqrt[2.5]{x}", "incorrect", "mathlive"],
  ["10^{10^{10}}", "invalid", "mathlive"],
  ["x^{2}", "correct", "mathlive"],
  ["x^2", "correct", "mathlive"],
  ["\\left(x\\right)^2", "correct", "mathlive"],
  ["x\\cdot x", "correct", "mathlive"],
]

[[group]]
name = "rob-number"
type = "number"
key = "1"
cases = [
  ["10^10^10", "invalid"],
  ["9^9^9^9", "invalid"],
  ["10^(10^10)", "invalid"],
  ["10^(-10^10)", "invalid"],
  ["2^2^2^2^2^2", "invalid"],
  ["(10^1000)!", "invalid"],
  ["5!", "invalid"],
  ["sin(10^10^10)", "invalid"],
  ["e^(e^(e^(e^10)))", "undecidable"],
  ["0^0", "incorrect"],  # FA fixed
  ["1^inf", "invalid"],
  ["inf/inf", "invalid"],
  ["inf^0", "invalid"],
  ["(-1)^(1/2)", "incorrect"],
  ["sqrt(-1)^2 + 2", "incorrect"],
  ["ln(-1)", "incorrect"],
  ["log_1(5)", "invalid"],
  ["log_0(5)", "invalid"],
  ["log_(-2)(4)", "invalid"],
  ["root(4, 0)", "incorrect"],
  ["root(-4, 2)", "incorrect"],
  ["root(8, 1/3)", "incorrect"],
  ["arcsin(2)", "incorrect"],
  ["", "invalid"],
  ["   ", "invalid"],
  ["\u000a", "invalid"],
  ["((((((((((((((((((((((((((((((((((((((((((((((1))))))))))))))))))))))))))))))))))))))))))))))", "invalid"],
  ["((((((((((((((((((((((((((((((1))))))))))))))))))))))))))))))", "correct"],
  ["__import__('os').system('ls')", "invalid"],
  ["eval('1')", "invalid"],
  ["exec(1)", "invalid"],
  ["lambda: 1", "invalid"],
  ["(1).__class__", "invalid"],
  ["Integer(1)", "invalid"],
  ["S(1)", "invalid"],
  ["E", "invalid"],
  ["I", "invalid"],
  ["oo", "incorrect"],
  ["zoo", "invalid"],
  ["nan", "invalid"],
  ["1; 1", "invalid"],
  ["\u0000", "invalid"],
  ["1\u0000", "invalid"],  # fixed (was incorrect)
  ["\u202e1", "invalid"],
  ["1\u200b", "invalid"],
  ["１", "correct"],
  ["−1", "incorrect"],
  ["1 😀", "invalid"],
  ["sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(sin(1))))))))))))))))))))", "incorrect"],
  ["1", "correct"],
  ["1.000000000000000000000000000000000000000000000000000000001", "correct"],
  ["0.9999999999999999999999999999999999999999999999", "correct"],
  ["2^(2^(2^(2^2)))", "invalid"],
  ["(1+1/10^1000)^(10^1000)", "invalid"],
  ["sin(pi*10^50)", "undecidable"],
  ["--1", "correct"],
  ["+-+-1", "invalid"],
  ["1/0", "incorrect"],
  ["0/0", "incorrect"],
]

[[group]]
name = "rob-length"
type = "number"
key = "1"
cases = [
  ["", "correct"],
]

[[group]]
name = "rob-expression"
type = "expression"
key = "x"
cases = [
  ["x^(10^10)", "invalid"],
  ["x^x^x^x^x^x", "incorrect"],
  ["e^(e^(e^(e^(e^x))))", "incorrect"],
  ["sin(x)^(10^6)", "invalid"],
  ["(x+1)^1000 - (x+1)^1000 + x", "correct"],
  ["x + inf - inf", "invalid"],
  ["x*inf/inf", "invalid"],
  ["x!", "invalid"],
  ["x.__class__", "invalid"],
  ["sin()", "invalid"],
  ["abs()", "invalid"],
  ["|||x|||", "incorrect"],
  ["x^", "invalid"],
  ["^x", "invalid"],
  ["x**2", "incorrect"],
  ["x^^2", "invalid"],
  ["х", "invalid"],
  ["ｘ", "correct"],
  ["X", "invalid"],
  ["y", "invalid"],
  ["sinx", "invalid"],
  ["sin x", "invalid"],
  ["xx", "invalid"],
  ["x2", "invalid"],
  ["2 x", "incorrect"],
  ["sqrt(sqrt(sqrt(sqrt(sqrt(sqrt(sqrt(sqrt(sqrt(sqrt(x^1024))))))))))", "invalid"],
  ["log_x(2)", "incorrect"],
  ["root(x, x)", "incorrect"],
  ["(x+1)^(10^5)", "invalid"],
  ["1/(x - x)", "incorrect"],
  ["sqrt(-1 - x^2)", "incorrect"],
  ["ln(-abs(x) - 1)", "incorrect"],
]

[[group]]
# M7: inequality answers need the declared variable (ADR-0019 item 11, MATH-9)
name = "rob-interval"
type = "interval"
key = "(1, 2)"
opts = { vars = ["x"] }
cases = [
  ["(1, 2, 3)", "invalid"],
  ["(inf, 1)", "invalid"],
  ["[inf, inf]", "invalid"],
  ["(2, 1)", "incorrect"],
  ["(1,1)", "incorrect"],
  ["1 < x < 0", "incorrect"],
  ["x < x", "invalid"],
  ["(1, 2) U", "invalid"],
  ["U", "invalid"],
  ["(1, 2) U U (3, 4)", "invalid"],
  ["(DNE, 2)", "invalid"],
  ["(1, x)", "invalid"],
  ["(1, 2) U (1.5, 2)", "correct"],
  ["(1, 1.5) U [1.5, 2)", "correct"],
  ["(1, 1.5) U (1.5, 2)", "incorrect"],
]

[[group]]
name = "rob-structures"
type = "set"
key = "1, 2"
cases = [
  ["1,,2", "invalid"],
  [",", "invalid"],
  ["{1, {2}}", "invalid"],
  ["(1, 2)", "invalid"],
  ["[1, 2]", "invalid"],
  ["1, 2, ", "invalid"],
  ["x = 1 or x = 2", "invalid"],
]

[[group]]
name = "lt-third"
type = "number"
key = "1/3"
opts = { form = "lowest-terms" }
cases = [
  ["0.3333", "incorrect"],  # FA fixed
  ["0.33333333", "incorrect"],  # FA fixed
]

[[group]]
name = "tiny-decay"
type = "expression"
key = "e^(-x^2)"
opts = { domain = "x > 10" }
cases = [
  ["2e^(-x^2)", "incorrect"],
  ["e^(-x^2)", "correct"],
  ["-e^(-x^2)", "incorrect"],
]

[[group]]
name = "tiny-decay2"
type = "expression"
key = "e^(-100x)"
opts = { domain = "x > 1" }
cases = [
  ["2e^(-100x)", "incorrect"],
  ["e^(-100x)/2", "incorrect"],
]

[[group]]
name = "sqrt-far"
type = "expression"
key = "x"
cases = [
  ["x + 0*sqrt(1000 - x)", "incorrect"],  # FA fixed
  ["x + 0*ln(100 - x)", "incorrect"],  # FA fixed
  ["x + 0*sqrt(x+100)", "incorrect"],  # FA fixed
]

[[group]]
name = "num-tiny-key"
type = "number"
key = "e^(-200)"
cases = [
  ["2e^(-200)", "incorrect"],  # FA fixed
  ["e^(-201)", "incorrect"],  # FA fixed
  ["0", "incorrect"],  # FA fixed
]

[[group]]
name = "anti-tiny"
type = "antiderivative"
key = "-e^(-x)/1000 + C"
opts = { domain = "x > 60" }
cases = [
  ["-e^(-x) + C", "incorrect"],
  ["e^(-x)/1000", "incorrect"],
]

[[group]]
name = "either-hole"
type = "interval"
key = "(-inf, 0) U (0, inf)"
opts = { endpoints = "either" }
cases = [
  ["(-inf, inf)", "incorrect"],  # FA fixed
  ["(-inf, 0] U [0, inf)", "incorrect"],  # FA fixed
  ["(-inf, 0) U (0, inf)", "correct"],
  ["(-inf, 0] U (0, inf)", "incorrect"],  # FA fixed
]

[[group]]
name = "either-interior"
type = "interval"
key = "[-1, 3]"
opts = { endpoints = "either" }
cases = [
  ["[-1, 1) U (1, 3]", "incorrect"],  # FA fixed
  ["(-1, 1) U (1, 3)", "incorrect"],  # FA fixed
  ["(-1, 3)", "correct"],
  ["[-1, 1] U [1, 3]", "correct"],
]

[[group]]
name = "expanded-gaming"
type = "expression"
key = "x^2 + 2x + 1"
opts = { form = "expanded" }
cases = [
  ["sqrt((x+1)^4)", "incorrect"],  # FA fixed
  ["((x+1)^4)^(1/2)", "incorrect"],  # FA fixed
  ["abs((x+1)^2)", "incorrect"],  # FA fixed
  ["root((x+1)^6, 3)", "incorrect"],  # FA fixed
  ["x^2 + 2x + 1", "correct"],
]

[[group]]
name = "factored-gaming"
type = "expression"
key = "(x-2)(x+2)"
opts = { form = "factored" }
cases = [
  ["((x^2-4)^3)^(1/3)", "incorrect"],  # FA fixed
  ["root((x^2-4)^3, 3)", "incorrect"],  # FA fixed
  ["(x-2)(x+2)", "correct"],
  ["(x^2-4)^(3/3)", "incorrect"],
]

[[group]]
name = "lt-gaming"
type = "number"
key = "3/4"
opts = { form = "lowest-terms" }
cases = [
  ["1 - 1/4", "incorrect"],  # FA fixed
  ["3/4 + 0", "incorrect"],  # FA fixed
  ["(3/4)^1", "incorrect"],  # FA fixed
  ["sqrt(9/16)", "incorrect"],  # FA fixed
  ["sqrt(36/64)", "incorrect"],
  ["6^1/8", "incorrect"],
  ["(6/8)^1", "incorrect"],
]

[[group]]
name = "simplified-gaming"
type = "number"
key = "sqrt(2)"
opts = { form = "simplified" }
cases = [
  ["sqrt(2)", "correct"],
  ["sqrt(8)/2", "incorrect"],
  ["1.41421356", "incorrect"],  # FA fixed
  ["2/sqrt(2)", "incorrect"],  # FA fixed
]

[[group]]
name = "mv-abs"
type = "expression"
key = "x + y"
opts = { vars = ["x", "y"] }
cases = [
  ["x + y + abs(x - y) - 100 + abs(abs(x - y) - 100)", "incorrect"],  # FA fixed
  ["x + y + abs(x*y) - 3000 + abs(abs(x*y) - 3000)", "incorrect"],  # FA fixed
  ["x*y/(x*y) * (x + y)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["(x + y)*(x - y)/(x - y)", "invalid"],  # M7: hole-only, not wrong (ADR-0019 item 10); was incorrect
  ["y + x", "correct"],
  ["x + y + 0*sqrt(1000 - x*y)", "incorrect"],  # FA fixed
]

[[group]]
name = "mv-eq"
type = "equation"
key = "z = x + y"
cases = [
  ["z = x + y + abs(x - y) - 100 + abs(abs(x - y) - 100)", "incorrect"],  # FA fixed
  ["z - x = y", "correct"],
]
