# Reviewer's adversarial cases (wave 3 grader review), written before reading the rest
# of the golden suite: Calculus I-III, precalculus and trig answers, every answer type
# and checker option, MathLive LaTeX, and robustness inputs.
# Marks: FA = a false accept the original checker made (it said correct), now fixed;
# FR = a false reject (or unreadable right answer), now fixed. Unmarked rows held.

[[group]]
name = "num-neg-two-thirds"
type = "number"
key = "-2/3"
cases = [
  ["2/3", "incorrect"],
  ["-4/6", "correct"],
  ["-(2/3)", "correct"],
  ["(-2)/3", "correct"],
  ["2/(-3)", "correct"],
  ["-0.6667", "correct"],
  ["-0.667", "correct"],
  ["-0.67", "correct"],  # M7: within the 1% default (ADR-0019 item 11); was incorrect at 0.1%
  ["-0.66", "correct"],  # M7: exactly 1% off; the 1% default is inclusive (ADR-0019 item 11)
  ["-666/1000", "incorrect"],
  ["-.6667", "correct"],
  ["-3/2", "incorrect"],
]

