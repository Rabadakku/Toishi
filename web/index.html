<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Offline-only policy, see docs/decisions/0002-offline-and-csp.md.
      'unsafe-inline' is for styles only: KaTeX and MathLive write style="" attributes,
      and MathLive inserts <style> elements at runtime. Scripts never get it, and nothing gets 'unsafe-eval'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toishi</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
